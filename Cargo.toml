[package]
name = "netservices"
description = "Library for building scalable privacy-preserving networking apps and P2P nodes"
version = "0.12.0-beta.1"
authors = ["Dr. Maxim Orlovsky <orlovsky@cyphernet.org>"]
keywords = ["privacy", "cypherpunk", "tor", "p2p", "reactor"]
categories = ["network-programming", "cryptography", "concurrency"]
homepage = "https://cyphernet.org"
repository = "https://github.com/Cyphernet-Labs/netservices.rs"
rust-version = "1.85.0"
edition = "2024"
license = "Apache-2.0"
readme = "README.md"

[dependencies]
amplify = "4.8.0"
io-reactor = { version = "0.6.0", optional = true }
cyphernet = { version = "0.5.2", features = ["ed25519", "pem", "multibase", "noise_sha2", "noise_x25519", "noise-framework", "mixnets", "dns"] }
crossbeam-channel = "0.5.15"
socket2 = { version = "0.5.7", optional = true, features = ["all"] }
libc = { version = "0.2.154", optional = true }
log = { version = "0.4.17", optional = true }
rand = "0.9.0" # Used in SplitIo shared secret

[dev-dependencies]
log = { version = "0.4.17" }

[features]
default = ["reactor", "socket2"]
all = ["reactor", "nonblocking", "eidolon", "log"]
eidolon = ["cyphernet/eidolon", "cyphernet/x25519"]
reactor = ["dep:io-reactor", "nonblocking"]
socket2 = ["dep:socket2", "nonblocking"]
nonblocking = ["socket2", "dep:libc"]
log = ["dep:log", "io-reactor/log"]

[package.metadata.docs.rs]
all-features = false
features = []
rustc-args = ["--cfg", "docsrs"]

[patch.crates-io]
amplify = { git = "https://github.com/rust-amplify/rust-amplify", branch = "develop" }
io-reactor = { git = "https://github.com/rust-amplify/io-reactor", branch = "develop" }
cyphergraphy = { git = "https://github.com/cyphernet-dao/rust-cyphernet", branch = "master" }
cypheraddr = { git = "https://github.com/cyphernet-dao/rust-cyphernet", branch = "master" }
